<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Стихи | Творчество Автора</title>
    <style>
        :root {
            --bg-color: #fcfbf9;
            --text-color: #2c2c2c;
            --accent-color: #8b5a2b;
            --card-bg: #ffffff;
        }
        body {
            font-family: 'Georgia', serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }
        header {
            padding: 30px 20px;
            border-bottom: 1px solid #e0dad3;
            background: #fff;
            text-align: center;
        }
        header h1 {
            margin: 0 0 10px 0;
            font-size: 2em;
            font-weight: normal;
        }
        nav a {
            color: var(--accent-color);
            text-decoration: none;
            margin: 0 15px;
        }
        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
            text-align: center;
        }
        .placeholder-text {
            font-style: italic;
            color: #777;
            margin-top: 50px;
            font-size: 1.2em;
        }
        footer {
            text-align: center;
            padding: 40px 20px;
            font-size: 0.9em;
            color: #888;
            border-top: 1px solid #e0dad3;
            margin-top: 60px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Мои стихотворения</h1>
        <nav>
            <a href="index.html">← На главную</a>
        </nav>
    </header>

    <div class="container">
        <div class="placeholder-text">
            Раздел находится в разработке. Скоро здесь появятся новые стихотворения.
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Рамо Бин Ях. Все права защищены.</p>
    </footer>

</body>
</html>
