<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Стихи | Творчество Автора</title>
    <style>
        :root {
            --bg-color: #fcfbf9;
            --text-color: #2c2c2c;
            --accent-color: #8b5a2b;
            --card-bg: #ffffff;
            
            /* Цвета для четырех разных свитков */
            --scroll-color-1: #ebdcc5; /* Классический пергамент */
            --scroll-color-2: #dfd5c6; /* Пепельный старинный */
            --scroll-color-3: #e6cfb3; /* Теплое золото */
            --scroll-color-4: #d9caa7; /* Оливковый пергамент */
        }
        body {
            font-family: 'Georgia', serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }
        header {
            padding: 30px 20px;
            border-bottom: 1px solid #e0dad3;
            background: #fff;
            text-align: center;
        }
        header h1 {
            margin: 0 0 10px 0;
            font-size: 2em;
            font-weight: normal;
        }
        nav a {
            color: var(--accent-color);
            text-decoration: none;
            margin: 0 15px;
        }
        
        /* Главный контейнер сетки */
        .container {
            max-width: 900px;
            margin: 50px auto;
            padding: 0 20px;
        }

        /* Текстовое меню сверху */
        .poems-menu {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin-bottom: 50px;
            flex-wrap: wrap;
        }
        .poems-menu a {
            color: var(--text-color);
            text-decoration: none;
            font-size: 1.1em;
            padding-bottom: 5px;
            border-bottom: 1px dashed transparent;
            transition: all 0.3s ease;
        }
        .poems-menu a:hover {
            color: var(--accent-color);
            border-bottom-color: var(--accent-color);
        }

        /* Двухколоночная сетка для свитков */
        .scrolls-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px 50px;
            justify-items: center;
            align-items: center;
        }

        /* Ссылка-обертка для свитка */
        .scroll-link {
            text-decoration: none;
            color: inherit;
            display: block;
            width: 100%;
            max-width: 380px;
            perspective: 1000px;
        }

        /* Базовый стиль горизонтального свитка */
        .scroll-card {
            background-image: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.3), transparent);
            border-top: 10px solid #704b24;
            border-bottom: 10px solid #704b24;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1), inset 0 0 30px rgba(117, 81, 49, 0.2);
            padding: 35px 30px;
            box-sizing: border-box;
            position: relative;
            text-align: center;
            transition: transform 0.4s cubic-bezier(0.165, 0.84, 0.44, 1), box-shadow 0.4s ease;
        }

        /* Наведение на свиток */
        .scroll-link:hover .scroll-card {
            transform: translateY(-5px) rotateX(4deg);
            box-shadow: 0 12px 25px rgba(112, 75, 36, 0.25), inset 0 0 40px rgba(117, 81, 49, 0.25);
        }

        /* Индивидуальные цвета пергамента */
        .scroll-1 { background-color: var(--scroll-color-1); }
        .scroll-2 { background-color: var(--scroll-color-2); }
        .scroll-3 { background-color: var(--scroll-color-3); }
        .scroll-4 { background-color: var(--scroll-color-4); }

        /* Боковые деревянные валики */
        .scroll-card::before,
        .scroll-card::after {
            content: '';
            position: absolute;
            top: -15px;
            bottom: -15px;
            width: 16px;
            background: linear-gradient(to right, #361f0c, #694422 50%, #291607);
            box-shadow: 2px 0 6px rgba(0,0,0,0.3);
            border-radius: 8px;
            transition: transform 0.4s ease;
        }
        .scroll-card::before { left: -8px; }
        .scroll-card::after { right: -8px; }

        /* Внутреннее оформление рамки */
        .scroll-inner {
            border: 1px solid rgba(112, 75, 36, 0.2);
            padding: 20px 10px;
            background: rgba(255, 255, 255, 0.05);
        }

        .scroll-title {
            margin: 0;
            font-size: 1.4em;
            font-weight: normal;
            color: #442d18;
            letter-spacing: 1px;
        }

        .scroll-decorative {
            font-size: 0.9em;
            color: var(--accent-color);
            margin-top: 5px;
            opacity: 0.7;
        }

        footer {
            text-align: center;
            padding: 40px 20px;
            font-size: 0.9em;
            color: #888;
            border-top: 1px solid #e0dad3;
            margin-top: 80px;
        }

        /* Адаптивность для мобильных устройств (перестраиваем в одну колонку) */
        @media (max-width: 768px) {
            .scrolls-grid {
                grid-template-columns: 1fr;
                gap: 30px;
            }
            .poems-menu {
                gap: 15px;
            }
        }
    </style>
</head>
<body>

        <h1>Мои стихотворения</h1>
        <nav>

            <a href="entrActe.html" class="menu-item-link">Антракт</a>

        <!-- Две колонки свитков по центру -->
        <div class="scrolls-grid">
            
            <!-- Карточка 1 -->
            <a href="horizons.html" class="scroll-link">
                <div class="scroll-card scroll-1">

            <!-- Карточка 4 -->
            <a href="entrActe.html" class="scroll-link">

                    <div class="scroll-inner">
                        <h2 class="scroll-title">Антракт</h2>

            </a>

        </div>
    </div>

    </footer>

    <script>
        // Синтезатор звука разворачивающегося свитка (Web Audio API)
        let audioCtx = null;

        function playScrollSound() {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }

                const duration = 0.45; 
                const bufferSize = audioCtx.sampleRate * duration;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);

                // Создание легкого шума трения бумаги
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }

                const noiseSource = audioCtx.createBufferSource();
                noiseSource.buffer = buffer;

                // Бумажный фильтр частот
                const filter = audioCtx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(550, audioCtx.currentTime);
                filter.frequency.exponentialRampToValueAtTime(120, audioCtx.currentTime + duration);

                // Громкость
                const gainNode = audioCtx.createGain();
                gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
                gainNode.gain.linearRampToValueAtTime(0.05, audioCtx.currentTime + 0.08);
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);

                noiseSource.connect(filter);
                filter.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                noiseSource.start();
            } catch (e) {
                console.log("Звук заблокирован политикой браузера.");
            }
        }

        // Привязываем звук ко всем ссылкам меню и свитков
        document.querySelectorAll('.scroll-link, .menu-item-link').forEach(link => {
            link.addEventListener('click', (e) => {
                playScrollSound();
                // Задержка перехода на 250мс, чтобы пользователь успел услышать шуршание
