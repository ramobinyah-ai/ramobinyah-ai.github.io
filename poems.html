<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Стихи | Рамо Бин Ях</title>
    <style>
        body {
            font-family: 'Georgia', serif;
            line-height: 1.6;
            margin: 0;
            padding: 0;
            background-color: #f9f9f9;
            color: #333;
        }
        header {
            background-color: #fff;
            border-bottom: 1px solid #ddd;
            padding: 20px 0;
            text-align: center;
        }
        header h1 {
            margin: 0;
            font-size: 24px;
            letter-spacing: 2px;
        }
        .container {
            max-width: 600px;
            margin: 40px auto;
            padding: 0 20px;
        }
        /* Стиль кнопки возврата как на странице книг */
        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            text-decoration: none;
            color: #007bff;
            font-weight: bold;
            transition: color 0.2s ease;
        }
        .back-link:hover {
            color: #0056b3;
            text-decoration: underline;
        }
        .placeholder-text {
            font-style: italic;
            color: #999;
            margin-top: 50px;
            text-align: center;
            font-size: 18px;
        }
        footer {
            text-align: center;
            padding: 20px 0;
            color: #777;
            font-size: 14px;
            border-top: 1px solid #ddd;
            background: #fff;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>
<body>

<header>
    <h1>Рамо Бин Ях</h1>
</header>

<div class="container">
    <!-- Кнопка возврата один в один как на books.html -->
    <a href="index.html" class="back-link">← На главную</a>

    <div class="placeholder-text">
        Раздел находится в разработке. Скоро здесь появятся новые стихотворения.
    </div>
</div>

<footer>
    © 2026 Рамо Бин Ях. Все права защищены.
</footer>

</body>
</html>
