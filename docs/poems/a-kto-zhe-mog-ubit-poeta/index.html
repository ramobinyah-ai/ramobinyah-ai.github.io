<!-- Скрипт для копирования ссылки -->
<script>
function copyPoemLink() {
    const shareBtn = document.getElementById('shareBtn');
    
    // Используем современное и безопасное API для копирования текущего URL
    navigator.clipboard.writeText(window.location.href).then(() => {
        // Успешное копирование: меняем текст и добавляем класс стиля
        shareBtn.textContent = 'Ссылка скорпирована!';
        shareBtn.classList.add('copied');
        shareBtn.disabled = true; // Защита от повторных кликов во время анимации
        
        // Через 2 секунды возвращаем всё в исходный вид
        setTimeout(() => {
            shareBtn.textContent = 'Поделиться';
            shareBtn.classList.remove('copied');
            shareBtn.disabled = false;
        }, 2000);
    }).catch(err => {
        console.error('Ошибка при копировании: ', err);
    });
}
</script>
