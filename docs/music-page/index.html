 <!-- Музыкальный плеер -->
<style>
  .poetry-player {
    max-width: 520px;
    margin: 25px auto;
    padding: 22px 26px;
    background: linear-gradient(145deg, #1a2421 0%, #24332e 100%);
    border: 1px solid rgba(212, 175, 55, 0.35);
    border-radius: 16px;
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
    color: #f4efe6;
    font-family: 'Georgia', serif;
    box-sizing: border-box;
  }

  .player-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 16px;
    gap: 10px;
  }

  .track-title {
    font-size: 1.2rem;
    font-weight: normal;
    color: #e8c872;
    margin: 0;
    letter-spacing: 0.4px;
  }

  .track-subtitle {
    font-size: 0.85rem;
    color: #a3b1ac;

    margin: 4px 0 0 0;
  }

  .player-controls {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .play-btn {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    border: 1px solid #d4af37;
    background: rgba(212, 175, 55, 0.15);
    color: #e8c872;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.25s ease;
  }

  .play-btn:hover {
    background: #d4af37;
    color: #1a2421;
    transform: scale(1.05);
  }

  .play-btn svg {
    width: 20px;
    height: 20px;
    fill: currentColor;
  }

  .progress-section {
    flex-grow: 1;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .progress-bar-container {
    width: 100%;
    height: 6px;
    background: rgba(255, 255, 255, 0.12);
    border-radius: 4px;
    cursor: pointer;
    position: relative;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #c59b27, #f0d58c);
    border-radius: 4px;
    transition: width 0.1s linear;
  }

  .time-row {
    display: flex;
    justify-content: space-between;
    font-size: 0.78rem;
    color: #a3b1ac;
    font-family: sans-serif;
  }

  @media (max-width: 480px) {
    .poetry-player {
      padding: 18px;
      margin: 15px 10px;
    }
    .track-title {
      font-size: 1.05rem;
    }
  }
</style>
<!-- Трек 1 -->
<div class="poetry-player" data-audio-src="docs/music-page/hrenov-telekom.mp3">
  <div class="player-header">
    <div>
      <h3 class="track-title">Название стихотворения</h3>
      <p class="track-subtitle">Читает автор</p>
    </div>
  </div>

  <div class="player-controls">
    <button class="play-btn" aria-label="Воспроизвести или пауза">
      <!-- Иконка Play -->
      <svg class="icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      <!-- Иконка Pause (скрыта по умолчанию) -->
      <svg class="icon-pause" viewBox="0 0 24 24" style="display: none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
    </button>

    <div class="progress-section">
      <div class="progress-bar-container">
        <div class="progress-fill"></div>
      </div>
      <div class="time-row">
        <span class="current-time">0:00</span>
        <span class="duration">0:00</span>
      </div>
    </div>
  </div>
</div>

<script>
  document.querySelectorAll('.poetry-player').forEach(player => {
    const audio = new Audio(player.dataset.audioSrc);
    const playBtn = player.querySelector('.play-btn');
    const iconPlay = player.querySelector('.icon-play');
    const iconPause = player.querySelector('.icon-pause');
    const progressContainer = player.querySelector('.progress-bar-container');
    const progressFill = player.querySelector('.progress-fill');
    const currentTimeEl = player.querySelector('.current-time');
    const durationEl = player.querySelector('.duration');

    function formatTime(sec) {
      if (isNaN(sec)) return '0:00';
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    audio.addEventListener('loadedmetadata', () => {
      durationEl.textContent = formatTime(audio.duration);
    });

    playBtn.addEventListener('click', () => {
      // Ставим на паузу другие плееры на странице, если запущен новый
      document.querySelectorAll('audio').forEach(a => { if (a !== audio) a.pause(); });
      
      if (audio.paused) {
        audio.play();
        iconPlay.style.display = 'none';
        iconPause.style.display = 'block';
      } else {
        audio.pause();
        iconPlay.style.display = 'block';
        iconPause.style.display = 'none';
      }
    });

    audio.addEventListener('timeupdate', () => {
      const percent = (audio.currentTime / audio.duration) * 100;
      progressFill.style.width = `${percent}%`;
      currentTimeEl.textContent = formatTime(audio.currentTime);
    });

    audio.addEventListener('ended', () => {
      iconPlay.style.display = 'block';
      iconPause.style.display = 'none';
      progressFill.style.width = '0%';
    });

    progressContainer.addEventListener('click', (e) => {
      const rect = progressContainer.getBoundingClientRect();
      const pos = (e.clientX - rect.left) / rect.width;
      audio.currentTime = pos * audio.duration;
    });
  });
</script>
