    const iconVolMute = document.getElementById('iconVolMute');

    let currentIndex = 0;

    function formatTime(sec) {
      if (isNaN(sec) || !isFinite(sec)) return '--:--';
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    // Автоматический расчет длительности для каждого трека в списке
    items.forEach((item) => {
      const durationBadge = item.querySelector('.playlist-item-duration');
      const tempAudio = new Audio();
      tempAudio.preload = 'metadata';
      tempAudio.src = item.dataset.src;

      tempAudio.addEventListener('loadedmetadata', () => {
        if (durationBadge) {
          durationBadge.textContent = formatTime(tempAudio.duration);
        }
        // Очищаем временный объект из памяти
        tempAudio.src = '';
      });

      tempAudio.addEventListener('error', () => {
        if (durationBadge) {
          durationBadge.textContent = '--:--';
        }
      });
    });

    function updatePlayIcons(isPlaying) {
      iconPlay.style.display = isPlaying ? 'none' : 'block';
      iconPause.style.display = isPlaying ? 'block' : 'none';
    }

      currentIndex = index;
      const item = items[index];
      items.forEach(el => el.classList.remove('active'));
      item.classList.add('active');

      npTitle.textContent = item.dataset.title;
      npAuthor.textContent = item.dataset.author || '';
