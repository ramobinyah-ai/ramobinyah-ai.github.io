<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Контакты | Творчество Автора</title>
    <style>
        :root {
            --bg-color: #fcfbf9;
            --text-color: #2c2c2c;
            --accent-color: #8b5a2b;
            --card-bg: #ffffff;
        }
        body {
            font-family: 'Georgia', serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }
        header {
            padding: 30px 20px;
            border-bottom: 1px solid #e0dad3;
            background: #fff;
            text-align: center;
        }
        header h1 {
            margin: 0 0 10px 0;
            font-size: 2em;
            font-weight: normal;
        }
        nav a {
            color: var(--accent-color);
            text-decoration: none;
            margin: 0 15px;
        }
        .container {
            max-width: 600px;
            margin: 60px auto;
            padding: 0 20px;
        }
        /* Блок контактов */
        .contacts-block {
            background: var(--card-bg);
            border: 1px solid #e0dad3;
            border-radius: 6px;
            padding: 40px 30px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.02);
            text-align: center;
        }
        .contacts-text {
            font-size: 1.15em;
            margin-bottom: 25px;
            color: #555;
        }
        .email-link {
            display: inline-block;
            font-size: 1.4em;
            color: var(--accent-color);
            text-decoration: none;
            font-weight: bold;
            border-bottom: 2px solid transparent;
            transition: border-color 0.2s, color 0.2s;
        }
        .email-link:hover {
            color: #6f4722;
            border-color: #6f4722;
        }
        footer {
            text-align: center;
            padding: 40px 20px;
            font-size: 0.9em;
            color: #888;
            border-top: 1px solid #e0dad3;
            margin-top: 80px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Контакты</h1>
        <nav>
            <a href="index.html">← На главную</a>
        </nav>
    </header>

    <div class="container">
        
        <div class="contacts-block">
            <p class="contacts-text">По вопросам сотрудничества, издания книг и предложений:</p>
            
            <!-- Кликабельный Email, который открывает почту пользователя -->
            <p><strong>Email:</strong> <a href="mailto:ramobinyah@gmail.com" class="email-link">ramobinyah@gmail.com</a></p>
        </div>

    </div>

    <footer>
        <p>&copy; 2026 Рамо Бин Ях. Все права защищены.</p>
    </footer>

</body>
</html>
